name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend — lint, build, test
    runs-on: ubuntu-latest

    # Real Postgres service so the integration tests exercise the same
    # database engine as production. SQLite would be faster but the schema
    # uses Postgres-only features (case-insensitive search, named uniques).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobportal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/jobportal_test
        run: npm test

  frontend:
    name: frontend — lint, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: docker — both images build cleanly
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t jobportal-backend ./backend

      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL=http://localhost:8000/api/v1 -t jobportal-frontend ./frontend
