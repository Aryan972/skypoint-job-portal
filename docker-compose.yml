services:
  db:
    image: postgres:16-alpine
    container_name: jobportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobportal-net
    # DB port intentionally not exposed to the host by default.
    # Uncomment to enable local clients (psql, DBeaver).
    # ports:
    #   - "${POSTGRES_PORT}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobportal-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: 8000
      SEED_HR_EMAIL: ${SEED_HR_EMAIL}
      SEED_HR_PASSWORD: ${SEED_HR_PASSWORD}
      SEED_HR_NAME: ${SEED_HR_NAME}
      SEED_CANDIDATE_EMAIL: ${SEED_CANDIDATE_EMAIL}
      SEED_CANDIDATE_PASSWORD: ${SEED_CANDIDATE_PASSWORD}
      SEED_CANDIDATE_NAME: ${SEED_CANDIDATE_NAME}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jobportal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: jobportal-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - jobportal-net

volumes:
  postgres_data:
    driver: local

networks:
  jobportal-net:
    driver: bridge