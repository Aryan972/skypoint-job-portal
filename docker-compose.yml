# =============================================================================
# Job Portal — orchestration for db + backend + frontend.
#
# Single-command startup:  docker compose up --build
#
# Every variable below has a sensible default via `${VAR:-default}` so the
# stack boots cleanly even on a fresh clone with no `.env` file. To override
# any value, copy `.env.example` to `.env` and edit — Compose reads `.env`
# automatically and your values win over the defaults in this file.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: jobportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-jobportal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobportal} -d ${POSTGRES_DB:-jobportal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobportal-net
    # DB port intentionally not exposed to the host by default.
    # Uncomment to enable local clients (psql, DBeaver).
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobportal-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobportal}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-jobportal}?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-string-at-least-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8000
      SEED_HR_EMAIL: ${SEED_HR_EMAIL:-admin@test.com}
      SEED_HR_PASSWORD: ${SEED_HR_PASSWORD:-Admin@1234}
      SEED_HR_NAME: ${SEED_HR_NAME:-HR Admin}
      SEED_CANDIDATE_EMAIL: ${SEED_CANDIDATE_EMAIL:-user@test.com}
      SEED_CANDIDATE_PASSWORD: ${SEED_CANDIDATE_PASSWORD:-User@1234}
      SEED_CANDIDATE_NAME: ${SEED_CANDIDATE_NAME:-Test Candidate}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jobportal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: jobportal-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - jobportal-net

volumes:
  postgres_data:
    driver: local

networks:
  jobportal-net:
    driver: bridge
